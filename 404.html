<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Страницы нет · FirstRoll</title>
<script>
/* GitHub Pages отдаёт этот файл на любой несуществующий адрес. Адреса Кодекса (/codex/cond/poisoned#half)
   передаём приложению Кодекса: /codex/?p=/cond/poisoned#half — оно само вернёт красивый адрес в строку. */
(function () {
  var p = location.pathname, i = p.indexOf('/codex/');
  if (i >= 0 && !/\.[a-z0-9]+$/i.test(p)) location.replace(p.slice(0, i + 7) + '?p=' + encodeURIComponent(p.slice(i + 6)) + location.hash);
})();
</script>
<script>try{var t=localStorage.getItem('kh-theme');t=t&&JSON.parse(t);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
