<body data-section="forge" data-page="sheet" data-root="../">
<div class="app-top no-print"><header id="site-head"></header></div>
<div class="sheet-bar no-print"><div class="in">
  <div class="segmented" role="radiogroup" aria-label="Вид листа"><button type="button" role="radio" data-view="mobile">Экран</button><button type="button" role="radio" data-view="a4">A4</button></div>
  <button class="btn" data-do="edit" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10.5 2.5 13.5 5.5 5.5 13.5H2.5V10.5z"/></svg>Редактировать</button>
  <button class="btn primary" data-do="pdf-a4" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>Скачать PDF</button>
  <button class="btn" data-do="pdf-phone" type="button"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="1" width="10" height="14" rx="2"/><path d="M6 12.5h2"/></svg>PDF для телефона</button>
  <button class="btn" data-do="print" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6V2h8v4M4 12H2V6h12v6h-2M4 9.5h8V14H4z"/></svg>Печать</button>
  <button class="btn" data-do="code" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5.5 4 1.5 8l4 4M10.5 4l4 4-4 4"/></svg>Код персонажа</button>
</div></div>
<div class="draft-note no-print" id="draft-note"></div>
<main class="sheet-mobile" id="mobile"></main>
<div class="a4-wrap" id="a4" hidden></div>

<footer id="site-foot" class="no-print"></footer>
